name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'CSV/**'
      - 'personal library.html'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync latest CSV to catalog.csv
        run: bash scripts/sync-latest-csv.sh

      - name: Stage site (index.html + catalog.csv)
        run: |
          mkdir -p _site
          cp "personal library.html" _site/index.html
          cp catalog.csv _site/catalog.csv

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
