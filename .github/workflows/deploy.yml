name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'books.json'
      - 'index.html'
      - 'scripts/**'
      - 'covers/**'
      - 'site.json'
      - 'og-card.jpg'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage site (index.html + books.json + covers + og-card)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp books.json _site/books.json
          [ -f site.json ] && cp site.json _site/site.json || true
          [ -d covers ] && cp -r covers _site/covers || true
          [ -f og-card.jpg ] && cp og-card.jpg _site/og-card.jpg || true

      - name: Inject OG meta (site.json + Pages URL into staged index.html)
        run: node scripts/inject-og.mjs --dir _site --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
