<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo — Book Card Variants</title>
  <style>
    :root{
      --bg:#0b0f19; --surface:#131c2e; --card:#172136; --accent:#6366f1;
      --text:#f8fafc; --muted:#94a3b8; --green:#10b981; --amber:#f59e0b;
      --radius:12px; --gap:12px; --pad:14px;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    html,body{height:100%;}
    body{background:var(--bg); color:var(--text); margin:0; display:flex; align-items:center; justify-content:center; padding:24px}

    .frame{width:360px}
    .card{background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:0 6px 18px rgba(2,6,23,0.6);}

    .cover{height:220px; background:linear-gradient(180deg,#060812,transparent); display:flex;align-items:center;justify-content:center}
    .cover img{max-height:100%; max-width:100%; object-fit:cover}

    .info{padding:var(--pad); display:flex;flex-direction:column; gap:8px}

    /* Shared typographic scale */
    .meta-line{font-size:0.78rem;color:var(--muted)}
    .title{font-size:1.05rem;font-weight:700;line-height:1.18;margin:0}
    .author{font-size:0.9rem;color:var(--muted);margin:0}

    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
    .status{font-size:0.75rem;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.03);color:var(--muted);font-weight:600}

    .author-top { display:block; }
    .author-bottom { display:none; }

    .hierarchical .author-top { color:var(--text); }

    .option-c .footer { justify-content:space-between; }
    .option-c .author-top { display:none; }
    .option-c .author-bottom { display:block; font-size:0.9rem; color:var(--muted); }
    .option-c .status { background: rgba(255,255,255,0.06); color: var(--text); }

    /* Reading-order badge */
    .badge{position:absolute;right:14px;top:14px;background:rgba(0,0,0,0.85);color:#fff;padding:6px 8px;border-radius:999px;font-weight:700}

    /* Option: Minimal */
    .minimal .meta-line{display:block}
    .minimal .title{font-size:1rem;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
    .minimal .author{font-size:0.85rem}

    /* Option: Hierarchical */
    .hierarchical .meta-line{color:var(--muted);font-weight:700}
    .hierarchical .title{font-size:1.15rem}
    .hierarchical .author{font-size:0.9rem;color:var(--text)}
    .hierarchical .meta-line small{color:var(--muted);font-weight:500}

    /* Container to position badge */
    .card-wrap{position:relative}

    /* Toggle UI */
    .controls{display:flex;gap:8px;justify-content:center;margin-top:14px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
    .btn.active{background:var(--accent);border-color:var(--accent)}

    /* Small screens adjust */
    @media (max-width:400px){ .frame{width:320px} }
  </style>
</head>
<body>
  <div class="frame">
    <div id="demo" class="card-wrap">
      <article class="card minimal" id="bookCard">
        <div class="cover">
          <img src="http://books.google.com/books/content?id=nVQPAAAAQBAJ&printsec=frontcover&img=1&zoom=1&fife=w800&edge=curl&source=gbs_api" alt="Book cover">
          <div class="badge">#1</div>
        </div>
        <div class="info">
          <div class="meta-line">Vol 3 · Stage 1 · 2013</div>
          <h3 class="title">The Design of Everyday Things</h3>
          <div class="author author-top">Don Norman</div>
          <div class="footer">
            <div class="author author-bottom">Don Norman</div>
            <div class="status">To Read</div>
          </div>
        </div>
      </article>
    </div>

    <div class="controls" aria-hidden="false">
      <button id="optA" class="btn active">Option A — Minimal</button>
      <button id="optB" class="btn">Option B — Hierarchical</button>
      <button id="optC" class="btn">Option C — Bottom author</button>
    </div>
  </div>

  <script>
    const optA = document.getElementById('optA');
    const optB = document.getElementById('optB');
    const optC = document.getElementById('optC');
    const card = document.getElementById('bookCard');

    function setOption(opt){
      card.classList.remove('minimal','hierarchical','option-c');
      optA.classList.remove('active'); optB.classList.remove('active'); optC.classList.remove('active');

      if(opt==='a'){
        card.classList.add('minimal');
        optA.classList.add('active');
      } else if(opt==='b'){
        card.classList.add('hierarchical');
        optB.classList.add('active');
      } else {
        card.classList.add('option-c');
        optC.classList.add('active');
      }
    }

    optA.addEventListener('click', ()=>setOption('a'));
    optB.addEventListener('click', ()=>setOption('b'));
    optC.addEventListener('click', ()=>setOption('c'));

    // keyboard support for the card (enter/space opens demo alert)
    card.setAttribute('tabindex','0');
    card.setAttribute('role','button');
    card.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); alert('Open edit modal (demo)'); } });
    card.addEventListener('click', ()=>alert('Open edit modal (demo)'));
  </script>
</body>
</html>
